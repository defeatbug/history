name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  workflow_dispatch:

# 同一分支的新提交会取消还在跑的旧任务，避免浪费 runner
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: 类型检查 / Lint / 单测 / 构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 类型检查
        run: npm run type-check

      # 只检查源码与脚本：.pi/ 下的第三方浏览器脚本不在本项目规范内
      - name: ESLint
        run: npx eslint src scripts

      - name: 单元测试
        run: npm test

      # build-only 不再重复跑一次 type-check（上面已跑）
      - name: 生产构建
        run: npm run build-only